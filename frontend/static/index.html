<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travel Concierge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
<style>
  :root {
    --accent: #0f766e;
    --accent-light: #14b8a6;
    --accent-gradient: linear-gradient(135deg, #0f766e 0%, #0d9488 50%, #0284c7 100%);
    --bg: #f8fafc;
    --card-bg: #ffffff;
    --border: #e2e8f0;
    --text-primary: #0f172a;
    --text-secondary: #475569;
    --text-muted: #94a3b8;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
    --shadow-md: 0 4px 14px -2px rgba(15, 118, 110, 0.08);
    --shadow-lg: 0 10px 25px -5px rgba(15, 118, 110, 0.12);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    background-image: radial-gradient(at 0% 0%, rgba(20, 184, 166, 0.04) 0px, transparent 50%),
                      radial-gradient(at 100% 100%, rgba(2, 132, 199, 0.04) 0px, transparent 50%);
    color: var(--text-primary);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  /* --- Header --- */
  header {
    background: var(--accent-gradient);
    color: #fff;
    padding: 1rem 1.5rem;
    box-shadow: var(--shadow-md);
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 10;
  }
  .header-brand {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }
  .header-icon {
    font-size: 1.6rem;
    background: rgba(255, 255, 255, 0.2);
    backdrop-filter: blur(8px);
    width: 42px;
    height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    box-shadow: inset 0 1px 1px rgba(255,255,255,0.3);
  }
  .header-title-group h1 {
    margin: 0;
    font-size: 1.25rem;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .header-title-group p {
    margin: 0;
    font-size: 0.8rem;
    opacity: 0.9;
    font-weight: 400;
  }
  .status-badge {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    background: rgba(255, 255, 255, 0.18);
    backdrop-filter: blur(8px);
    padding: 0.35rem 0.75rem;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 600;
    border: 1px solid rgba(255, 255, 255, 0.2);
  }
  .status-dot {
    width: 8px;
    height: 8px;
    background-color: #34d399;
    border-radius: 50%;
    box-shadow: 0 0 8px #34d399;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.7); }
    70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(52, 211, 153, 0); }
    100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); }
  }

  /* --- Chat Area --- */
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem 1rem;
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    scroll-behavior: smooth;
  }

  /* Custom scrollbar */
  #log::-webkit-scrollbar { width: 6px; }
  #log::-webkit-scrollbar-track { background: transparent; }
  #log::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
  #log::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

  .msg {
    display: flex;
    gap: 0.75rem;
    max-width: 88%;
    animation: fadeIn 0.25s ease-out;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.user {
    align-self: flex-end;
    flex-direction: row-reverse;
  }
  .msg.agent {
    align-self: flex-start;
  }

  .avatar {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    flex-shrink: 0;
    box-shadow: var(--shadow-sm);
  }
  .msg.user .avatar {
    background: var(--accent);
    color: #fff;
  }
  .msg.agent .avatar {
    background: #ffffff;
    border: 1px solid var(--border);
    color: var(--accent);
  }

  .bubble {
    padding: 0.85rem 1.1rem;
    border-radius: 16px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    color: var(--text-primary);
    font-size: 0.95rem;
    line-height: 1.5;
    box-shadow: var(--shadow-sm);
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user .bubble {
    background: var(--accent-gradient);
    color: #ffffff;
    border: none;
    border-bottom-right-radius: 4px;
    box-shadow: var(--shadow-md);
  }
  .msg.agent .bubble {
    border-bottom-left-radius: 4px;
  }
  .bubble.rich {
    background: transparent;
    border: none;
    padding: 0;
    max-width: 100%;
    box-shadow: none;
    white-space: normal;
  }

  /* --- Example Prompts Row --- */
  .examples-container {
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
    padding: 0 1rem;
  }
  .examples-row {
    display: flex;
    gap: 0.6rem;
    padding: 0.75rem 0.25rem;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .examples-row::-webkit-scrollbar { display: none; }

  .example-chip {
    background: rgba(255, 255, 255, 0.95);
    color: var(--text-secondary);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 0.5rem 1rem;
    font-size: 0.85rem;
    font-family: inherit;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: var(--shadow-sm);
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  .example-chip:hover {
    background: var(--accent);
    color: #ffffff;
    border-color: var(--accent);
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
  }

  /* --- Input Area --- */
  .input-wrapper {
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(12px);
    border-top: 1px solid var(--border);
    padding: 1rem;
  }
  form {
    max-width: 820px;
    margin: 0 auto;
    display: flex;
    gap: 0.6rem;
    align-items: center;
  }
  input {
    flex: 1;
    padding: 0.85rem 1.1rem;
    border: 1.5px solid var(--border);
    border-radius: 24px;
    font-size: 0.95rem;
    font-family: inherit;
    background: #ffffff;
    color: var(--text-primary);
    outline: none;
    transition: all 0.2s ease;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.03);
  }
  input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px rgba(15, 118, 110, 0.12);
  }
  button {
    padding: 0.85rem 1.4rem;
    border: none;
    border-radius: 24px;
    background: var(--accent-gradient);
    color: #ffffff;
    font-size: 0.95rem;
    font-family: inherit;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: var(--shadow-md);
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  button:hover {
    opacity: 0.95;
    transform: translateY(-1px);
    box-shadow: var(--shadow-lg);
  }
  button:active {
    transform: translateY(0);
  }

  /* --- A2UI component styles (Card, Column, Row, Text, Divider, List, Image, Icon) --- */
  .a2card {
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.25rem;
    background: #ffffff;
    box-shadow: var(--shadow-md);
    max-width: 100%;
  }
  .a2card + .a2card, .a2col > .a2card { margin-top: 0.75rem; }
  .a2col { display: flex; flex-direction: column; gap: 0.5rem; }
  .a2row { display: flex; flex-direction: row; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
  .a2row.between { justify-content: space-between; }
  .a2text { margin: 0; line-height: 1.5; color: var(--text-primary); }
  .a2text.a2-h1 { font-size: 1.4rem; font-weight: 700; color: var(--accent); letter-spacing: -0.01em; }
  .a2text.a2-h2 { font-size: 1.2rem; font-weight: 700; }
  .a2text.a2-h3 { font-size: 1.05rem; font-weight: 600; }
  .a2text.a2-h4 { font-size: 0.95rem; font-weight: 600; }
  .a2text.a2-caption { font-size: 0.85rem; color: var(--text-secondary); }
  .a2divider { border: none; border-top: 1px solid var(--border); margin: 0.6rem 0; width: 100%; }
  .a2img { max-width: 100%; border-radius: 12px; display: block; box-shadow: var(--shadow-sm); }
  .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-size: 1.25rem; line-height: 1; vertical-align: middle; color: var(--accent); }
</style>
</head>
<body>
<header>
  <div class="header-brand">
    <div class="header-icon">✈️</div>
    <div class="header-title-group">
      <h1>Travel Concierge</h1>
      <p>AI Destination Specialist & Itinerary Planner</p>
    </div>
  </div>
  <div class="status-badge">
    <span class="status-dot"></span> Agent Online
  </div>
</header>

<div id="log"></div>

<div class="examples-container">
  <div class="examples-row">
    <button type="button" class="example-chip" onclick="sendPrompt('Plan a 3-day trip to Tokyo with budget calculation')">🗺️ 3-Day Tokyo Itinerary</button>
    <button type="button" class="example-chip" onclick="sendPrompt('Show top sights in Paris with destination photos')">📸 Paris Sights & Photos</button>
    <button type="button" class="example-chip" onclick="sendPrompt('Find nearby Italian restaurants in Rome')">🍝 Rome Nearby Dining</button>
  </div>
</div>

<div class="input-wrapper">
  <form id="form">
    <input id="input" placeholder="Ask about destinations, itineraries, or venues…" autocomplete="off" autofocus>
    <button type="submit">
      Send
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
    </button>
  </form>
</div>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");

function sendPrompt(text) {
  input.value = text;
  form.dispatchEvent(new Event("submit"));
}

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function bubble(who) {
  const m = el("div", "msg " + who);
  const avatar = el("div", "avatar", who === "user" ? "👤" : "🧳");
  const b = el("div", "bubble");
  m.appendChild(avatar);
  m.appendChild(b);
  log.appendChild(m);
  log.scrollTop = log.scrollHeight;
  return b;
}

/* ----------------------------------------------------------------------------
 * A2UI mini-renderer (v0.8 Basic Catalog subset).
 * Renders Card / Column / Row / Text / Divider / List / Image / Icon.
 * Anything else falls back to plain text (see renderReply). All text goes in via
 * textContent and image URLs are validated, so agent output can't inject HTML.
 * -------------------------------------------------------------------------- */

function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      t.textContent = boundStr(props.text);
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;
      const img = el("img", "a2img"); img.src = src; img.alt = boundStr(props.alt) || ""; return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;
  }
}

function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function renderReply(b, parts) {
  b.textContent = "";
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) b.appendChild(el("div", null, textStr));

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  bubble("user").textContent = text;
  input.value = "";
  const b = bubble("agent"); b.textContent = "…";
  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text }) });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(b, data.parts || []);
  } catch (e) {
    b.textContent = "Error: " + e.message;
  }
});
</script>
</body>
</html>
